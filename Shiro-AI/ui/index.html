<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shiro ♡ local chat</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0d0d0d; color: #e0e0e0; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { padding: 10px 20px; background-color: #1a1a1a; border-bottom: 1px solid #333; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 10px 15px; border-radius: 15px; position: relative; display: flex; align-items: flex-end; gap: 10px; }
        .user { align-self: flex-end; background-color: #4a90e2; color: white; border-bottom-right-radius: 4px; flex-direction: row-reverse; }
        .shiro { align-self: flex-start; background-color: #222; color: white; border-bottom-left-radius: 4px; }
        .bubble { position: relative; }
        .avatar { width: 30px; height: 30px; border-radius: 50%; background-color: #333; flex-shrink: 0; }
        .user .avatar { background: #4a90e2 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c2.21 0 4 1.79 4 4s-1.79 4-4 4-4-1.79-4-4 1.79-4 4-4zm0 13.8c-2.67 0-5.26-1.32-6.5-3.58.02-2.14 4.27-3.27 6.5-3.27s6.48 1.13 6.5 3.27c-1.24 2.26-3.83 3.58-6.5 3.58z"/></svg>') center/cover; }
        .shiro .avatar { background: #111 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="%23000"/><path d="M30 45a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm40 0a5 5 0 1 1 0-10 5 5 0 0 1 0 10z" fill="%23fff"/><path d="M25 65c5 10 20 15 50 0" stroke="%23fff" stroke-width="6" fill="none" stroke-linecap="round"/></svg>') center/cover; }
        footer { padding: 20px; background-color: #1a1a1a; border-top: 1px solid #333; display: flex; gap: 10px; }
        input { flex: 1; padding: 10px 15px; border-radius: 20px; border: 1px solid #333; background-color: #222; color: white; outline: none; }
        button { padding: 10px 20px; border-radius: 20px; border: none; background-color: #4a90e2; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #357abd; }
    </style>
</head>
<body>
    <header>
        <h2>🦊 Shiro: The Sly Kitsune</h2>
    </header>
    <div id="chat">
        <div class="msg shiro">
            <div class="avatar"></div>
            <div class="bubble">Hmph, asking so directly? I'm Shiro, the sly kitsune yaoguai. What do you want, stranger? It's not like I'm curious or anything.</div>
        </div>
    </div>
    <footer>
        <input id="input" placeholder="talk to shiro, stranger..." autocomplete="off">
        <button id="send">Send</button>
    </footer>

    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');
        const send = document.getElementById('send');

        function addMessage(text, role) {
            const msg = document.createElement('div');
            msg.className = 'msg ' + role;
            msg.innerHTML = `<div class="avatar"></div><div class="bubble">${text}</div>`;
            chat.appendChild(msg);
            chat.scrollTop = chat.scrollHeight;
        }

        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            addMessage(text, 'user');

            const typing = document.createElement('div');
            typing.className = 'msg shiro';
            typing.innerHTML = '<div class="avatar"></div><div class="bubble"><i>Shiro is thinking…</i></div>';
            chat.appendChild(typing);

            try {
                const response = await fetch('/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, user_name: "Stranger" })
                });
                const data = await response.json();
                chat.removeChild(typing);
                addMessage(data.reply, 'shiro');
            } catch (e) {
                chat.removeChild(typing);
                addMessage("Hmph, something went wrong. Try again, dummy!", 'shiro');
            }
        }

        send.onclick = sendMessage;
        input.onkeypress = (e) => { if (e.key === 'Enter') sendMessage(); };
    </script>
</body>
</html>
