# Shiro-AI Configuration

llm:
  api_type: "ollama"
  base_url: "http://localhost:11434/api"
  model: "shiro:latest"
  fallback_model: "llama3.1:8b-instruct-q4_K_M"
  temperature: 0.68          # Slightly lower → less hallucination / fabricated recall
  top_p: 0.88                # Tighter nucleus keeps persona on-track
  repeat_penalty: 1.18       # Higher → suppresses Shiro looping the same phrase
  max_tokens: 768            # Was 512 — caused mid-sentence cutoffs (seen in log)
  num_ctx: 2048              # llama3.1 8B Q4_KM uses ~4.1 GB VRAM at 32 layers.
                             # 2048 ctx adds ~0.6 GB KV cache — total LLM ~4.7 GB.
                             # With GPT-SoVITS (~1.5 GB) + ChromaDB (~0.4 GB) = ~6.6 GB.
                             # 6144 was wrong — that adds ~1.8 GB KV cache, not 350 MB,
                             # pushing total to ~7.7 GB and causing the VRAM spike.
  use_native_tools: false
  num_gpu: 32                # llama3.1 8B Q4_KM = 4.07 GB at 32 layers.
                             # Your VRAM cap is 4 GB → this is the correct value.
                             # Was 18 (partial offload) which left 14 layers on CPU,
                             # slowing inference and destabilizing the persona.

stt:
  model_size: "small.en"
  device: "cpu"
  compute_type: "int8"

memory:
  db_path: "./shiro_memory"
  collection_name: "shiro_ai_memories"
  max_short_term: 10

