  theme: "soft"
  share: false

persona:
  sheet_path: "shiro_sheet.yaml"

# ── Vision ─────────────────────────────────────────────────────────────────
vision:
  enabled: false
  mode: on_demand
  passive_interval_secs: 60
  idle_unload_secs: 300
  device: cpu
  max_dim: 1280
  min_confidence: 0.4
  languages: ["en"]

# ── YouTube Chat ───────────────────────────────────────────────────────────
youtube_chat:
  enabled: false
  video_id: ""
  poll_interval: 2.0
  prefix_username: true

tts:
  enabled: true
  model_path:  "kokoro/kokoro-v0_19.onnx"
  voices_path: "kokoro/voices.bin"
  voice:       "shiro"
  language:    "en-us"
  speed:       0.85
  volume:      1.0
  device:      "cuda"

# ── Discord ────────────────────────────────────────────────────────────────
discord:
  enabled: true
  token: ""
  prefix: "!"
  owner_id: 226840618062708736
  shiro_names:
    - "shiro"
    - "hey shiro"
    - "shiro?"
    - "oi shiro"
  address_confidence_threshold: 0.55
  tts_in_voice: true
  stt_in_voice: false
  auto_start: false

# ── Stream Profiles ────────────────────────────────────────────────────────
stream_profiles:
  file: "./stream_profiles.json"
  min_messages_to_profile: 3
  message_history_limit: 15
  twitch_identity_map: {}
  youtube_identity_map: {}