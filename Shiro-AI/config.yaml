ui:
  title: "🦊 Shiro: The Sly Kitsune Yaoguai"
  theme: "soft"
  share: false

persona:
  sheet_path: "shiro_sheet.yaml"

# ── Vision ─────────────────────────────────────────────────────────────────
vision:
  enabled: false
  mode: on_demand
  passive_interval_secs: 60
  idle_unload_secs: 300
  device: cpu
  max_dim: 1280
  min_confidence: 0.4
  languages: ["en"]

# ── YouTube Chat ───────────────────────────────────────────────────────────
youtube_chat:
  enabled: false
  video_id: ""
  poll_interval: 2.0
  prefix_username: true

tts:
  enabled: true
  api_url: "http://127.0.0.1:9880"
  ref_audio: "F:/Shiro-AI/gpt_sovits_setup/tts_reference/shiro_reference2.wav"
  ref_text: "You should always be prepared for a sly fox to come across your path."
  language: "en"
  speed:    1.0
  volume:   1.0
  device:   "cuda"
  timeout: 40

# ── Discord ────────────────────────────────────────────────────────────────
discord:
  enabled: true
  token: ""
  prefix: "!"
  owner_id: 226840618062708736
  shiro_names:
    - "shiro"
    - "hey shiro"
    - "shiro?"
    - "oi shiro"
  address_confidence_threshold: 0.55
  tts_in_voice: true
  stt_in_voice: false
  auto_start: false

# ── Stream Profiles ────────────────────────────────────────────────────────
stream_profiles:
  file: "./stream_profiles.json"
  min_messages_to_profile: 3
  message_history_limit: 15
  twitch_identity_map: {}
  youtube_identity_map: {}