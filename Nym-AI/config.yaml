# Nym-AI Configuration

llm:
  api_type: "ollama"  # 'ollama' or 'openai'
  base_url: "http://localhost:11434/api"
  model: "llama3.1:8b-instruct-q4_K_M"
  temperature: 0.7
  max_tokens: 512

stt:
  model_size: "base"
  device: null  # 'cuda' or 'cpu', null for auto-detect
  compute_type: "float16"

memory:
  db_path: "./nym_memory"
  collection_name: "nym_ai_memories"
  max_short_term: 15

ui:
  title: "😈 Nym: The Ultimate Villain"
  theme: "soft"
  share: false

persona:
  sheet_path: "nym_sheet.yaml"
