<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aurelia Chroma Companion</title>
  <style>
    body { font-family: "Segoe UI", sans-serif; background: #0e0f1a; color: #f4f4f6; margin: 0; padding: 2rem; }
    h1 { color: #9dd6ff; }
    .memory { background: #1a1b2a; border-radius: 12px; padding: 1rem; margin-bottom: 1rem; }
    .meta { color: #94a3b8; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Aurelia Chroma Companion Dashboard</h1>
  <p>Recent memory snapshots from the Chroma companion.</p>
  {% for entry in entries %}
  <div class="memory">
    <div class="meta">{{ entry.created_at }} · {{ entry.source }}</div>
    <div>{{ entry.user_text }}</div>
  </div>
  {% else %}
  <p>No memories captured yet.</p>
  {% endfor %}
</body>
</html>
